name: CI/CD Pipeline

on:
  push:
    branches:
      - feedback
    tags:
      - 'v*.*.*'

env:
  FRONTEND_IMAGE: r0825266/frontend
  BACKEND_IMAGE: r0825266/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------- Docker ----------------
    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push backend
      run: |
        docker build -t $BACKEND_IMAGE:latest ./backend
        docker push $BACKEND_IMAGE:latest

    - name: Build & push frontend
      run: |
        docker build -t $FRONTEND_IMAGE:latest ./frontend
        docker push $FRONTEND_IMAGE:latest

    # ---------------- Kubernetes ----------------
    - name: Set up kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'latest'

    - name: Set up Helm
      uses: azure/setup-helm@v4
      with:
        version: 'latest'

    - name: Configure kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Verify cluster access
      run: |
        kubectl cluster-info
        kubectl get nodes

    # ---------------- Deploy TEST ----------------
    - name: Deploy to TEST
      if: github.ref == 'refs/heads/feedback'
      run: |
        helm upgrade --install taskmanager ./helm/taskmanager \
          -n taskmanager-test \
          --create-namespace \
          -f helm/taskmanager/values-test.yaml

    # ---------------- Deploy PROD ----------------
    - name: Deploy to PROD
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        helm upgrade --install taskmanager ./helm/taskmanager \
          -n taskmanager-prod \
          --create-namespace \
          -f helm/taskmanager/values-prod.yaml