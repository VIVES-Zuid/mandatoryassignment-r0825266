name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

env:
  FRONTEND_IMAGE: r0825266/frontend
  BACKEND_IMAGE: r0825266/backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & push backend
      run: |
        docker build -t $BACKEND_IMAGE:latest ./backend
        docker push $BACKEND_IMAGE:latest

    - name: Build & push frontend
      run: |
        docker build -t $FRONTEND_IMAGE:latest ./frontend
        docker push $FRONTEND_IMAGE:latest

    - name: Set up kubectl
      run: |
        echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > kubeconfig
        export KUBECONFIG=$PWD/kubeconfig
        kubectl get nodes

    - name: Deploy to TEST
      if: github.ref == 'refs/heads/main'
      run: |
        helm upgrade --install taskmanager ./helm/taskmanager \
          -n taskmanager-test \
          -f helm/taskmanager/values-test.yaml

    - name: Deploy to PROD
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        helm upgrade --install taskmanager ./helm/taskmanager \
          -n taskmanager-prod \
          -f helm/taskmanager/values-prod.yaml