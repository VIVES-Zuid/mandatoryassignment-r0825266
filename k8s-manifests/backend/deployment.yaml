apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: r0825266/backend:latest
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/warehouseDB"
            - name: PORT
              value: "5000"
          ports:
            - containerPort: 5000
