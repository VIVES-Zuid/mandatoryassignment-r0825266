apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflare
data:
  config.yml: |
    tunnel: b915b45c-ec8b-4420-9b57-554008a01663
    credentials-file: /etc/cloudflared/credentials.json

    ingress:
      - hostname: app.kloran-taskmanager.org
        service: http://frontend.default.svc.cluster.local:80

      - hostname: api.kloran-taskmanager.org
        service: http://backend.default.svc.cluster.local:8080

      - service: http_status:404