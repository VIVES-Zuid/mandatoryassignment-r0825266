<div class="page">
    <header class="topbar">
        <div>
            <h2 class="title">My Projects</h2>
            <p class="subtitle">Select a project to view its tasks</p>
        </div>

        <button class="btn btn-ghost" type="button" (click)="logout()">
            Logout
        </button>
    </header>

    @if (projects.length > 0) {
    <div class="grid">
        @for (project of projects; track project.id) {
        <button class="card" type="button" (click)="openProject(project.id)">
            <div class="card-title">{{ project.name }}</div>
            <div class="card-desc">
                {{ project.description || 'No description' }}
            </div>
            <div class="card-cta">View tasks →</div>
        </button>
        }
    </div>
    } @else {
    <div class="empty">
        <p class="empty-title">No projects found.</p>
        <p class="empty-sub">Create one first, then come back here.</p>
    </div>
    }
</div>
