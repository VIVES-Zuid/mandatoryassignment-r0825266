version: "3.9"

services:
  mysql:
    image: mysql:8.4
    container_name: taskmanager-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: taskmanager_dev
      MYSQL_USER: taskmanager_dev
      MYSQL_PASSWORD: taskmanager_dev
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
